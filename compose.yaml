services:
  php:
    container_name : php
    build : ./php
    volumes:
      - ./minimize:/var/www/html
    working_dir: /var/www/html
    
  nginx:
    container_name: nginx
    build : ./nginx
    ports:
      - 8888:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./minimize:/var/www/html
    depends_on:
      - php

  node:
    container_name : node
    build: ./node
    working_dir: /node
    tty : true
    stdin_open: true
    volumes :
      - ./minimize:/app
      - ./node/postcss/postcss.config.js:/node/postcss/postcss.config.js
      # - ./node/esbuild/watch.sh:/node/esbuild/watch.sh
      # - ./node/postcss/watch.sh:/node/postcss/watch.sh
    command: npm run dev
      # - /node/postcss/watch.sh
      # - /node/esbuild/watch.sh
