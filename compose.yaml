services:
  php:
    container_name : php
    build : ./php
    volumes:
      - ./public_html:/var/www/html
    working_dir: /var/www/html
    
  nginx:
    container_name: nginx
    build : ./nginx
    ports:
      - 8888:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public_html:/var/www/html
    depends_on:
      - php

  node:
    container_name : node
    build: ./node
    working_dir: /postcss
    tty : true
    volumes :
      - ./public_html:/app
      - ./node/postcss/:/postcss
    command: /postcss/postcss_watch.sh
